<style>
:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.5}
header.top{background:var(--mid-purple);color:#fff;text-align:center;padding:14px 16px 12px}
header.top .cross{color:#F1DDB8;font-size:20px;line-height:1}

header.top p{margin:2px 0 0;font-style:italic;font-size:15px;opacity:.92}
.progress{height:6px;background:var(--parch-dk)}
.progress>div{height:100%;width:0;background:var(--wheat);transition:width .35s ease}
main{max-width:640px;margin:0 auto;padding:22px 16px 100px}
.kicker{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);font-weight:700;margin:0 0 6px}
h2{font-family:var(--display);color:var(--purple);font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:600}
.intro{font-style:italic;color:var(--ink-light);margin:0 0 6px}
.scripture{font-style:italic;color:var(--wheat);font-size:16px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--parch-dk);border-radius:12px;padding:16px;margin:0 0 14px;box-shadow:0 1px 0 rgba(42,34,48,.04)}
.card.missing{border-color:var(--rose);box-shadow:0 0 0 3px rgba(196,123,138,.25)}
.num{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a7f98;font-weight:700;margin:0 0 4px}
.q{display:block;font-size:20px;color:var(--ink);margin:0 0 12px;font-weight:500}
.hint{font-family:var(--sans);font-size:13px;color:#7a6f88;margin:0 0 12px}
input[type=text],input[type=email],select,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:1.5px solid #d8cfe6;border-radius:10px;background:var(--parchment);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(139,123,168,.45);outline-offset:1px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{font-family:var(--sans);font-size:18px;font-weight:600;padding:12px 0;border-radius:10px;border:1.5px solid #d8cfe6;background:var(--parchment);color:var(--ink-light);cursor:pointer;min-height:48px}
.scale button[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:#fff}
.scale-ends{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;color:#7a6f88;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--mid-purple);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
.nav .inner{display:flex;gap:10px;width:100%;max-width:640px;align-items:center}
.btn{font-family:var(--sans);font-size:16px;font-weight:700;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--wheat);color:#fff;flex:1}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.btn.solid{background:var(--purple);color:#fff}
.btn.line{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
.btn[disabled]{opacity:.5;cursor:default}
.warn{font-family:var(--sans);font-size:14px;color:#fff;background:var(--rose);border-radius:8px;padding:8px 12px;margin:0 0 12px;display:none}
details.parents{margin:16px 0 0;font-family:var(--sans);font-size:14px;color:var(--ink-light)}
details.parents summary{cursor:pointer;color:var(--purple);font-weight:700}
.verse{font-style:italic;color:var(--wheat);text-align:center;margin:24px 0 4px;font-size:21px}
.verse small{display:block;font-style:normal;font-family:var(--sans);font-size:12px;color:#8a7f98;letter-spacing:.08em;margin-top:2px}
/* results */
.res{background:#fff;border:1px solid var(--parch-dk);border-left:5px solid var(--purple);border-radius:0 12px 12px 0;padding:16px;margin:0 0 16px}
.res h3{font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--purple);margin:0 0 8px;font-weight:600}
.hl{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--parch-dk);border-radius:10px;padding:10px 14px;text-align:center;margin:4px 0 4px}
.tag-line{text-align:center;font-style:italic;color:var(--ink-light);margin:0 0 12px}
.res p{margin:8px 0}
.lbl{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a7f98;font-weight:700;margin:12px 0 2px;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tags span{background:var(--purple);color:#fff;font-family:var(--sans);font-size:12px;padding:4px 10px;border-radius:999px}
.try{background:var(--parchment);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:8px 12px;margin:10px 0 0;font-size:17px}
.try b{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);display:block}
.barrow{margin:8px 0 0}
.barrow .bl{display:flex;justify-content:space-between;font-family:var(--sans);font-size:13px;color:var(--ink-light)}
.bar{height:8px;background:var(--parch-dk);border-radius:99px;overflow:hidden;margin-top:3px}
.bar>div{height:100%;background:var(--rose);border-radius:99px}
.second{margin-top:12px;padding-top:10px;border-top:1px dashed #d8cfe6}
.closing{background:var(--mid-purple);color:#fff;border-radius:12px;padding:20px 18px;text-align:center;font-style:italic;margin:6px 0 14px}
.closing small{display:block;font-style:normal;font-family:var(--sans);font-size:12px;opacity:.85;margin-top:10px}
.care{background:#fff;border:1.5px solid var(--rose);border-radius:12px;padding:14px 16px;margin:16px 0;font-family:var(--sans);font-size:14px}
.status{font-family:var(--sans);font-size:14px;margin:0 0 14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
@media print{header.top,.progress,.nav,.actions,.status{display:none}body{background:#fff}main{padding:0}}
</style>
</head>

var LAST=STEPS.length+1; /* results step */

function load(){try{var s=localStorage.getItem(STORE_KEY);if(s){var o=JSON.parse(s);if(o&&typeof o==="object"){
  state.name=o.name||"";state.email=o.email||"";state.age=o.age||"";state.consent=!!o.consent;state.sent=!!o.sent;state.note=o.note||"";state.a=o.a||{};state.step=Math.min(o.step||0,LAST);}}}catch(e){}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function wipe(){try{localStorage.removeItem(STORE_KEY);}catch(e){}}
function clean(v){return typeof v==="string"?v.trim():"";}
function el(tag,attrs){
  var n=document.createElement(tag);
  if(attrs){for(var k in attrs){if(!Object.prototype.hasOwnProperty.call(attrs,k))continue;
    if(k==="class")n.className=attrs[k];
    else if(k==="text")n.textContent=attrs[k];
    else if(k==="html")n.innerHTML=attrs[k]; /* only ever static strings from this file */
    else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);}}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;n.appendChild(typeof c==="string"?document.createTextNode(c):c);}
  return n;
}
function go(step){state.step=step;save();render();window.scrollTo(0,0);}
function formValid(){return !!clean(state.name)&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(clean(state.email))&&!!state.age&&state.consent;}
function unanswered(qs){return qs.filter(function(q){return typeof state.a[q.id]!=="number";});}

/* scoring: percent of the maximum for each group, so groups of different size compare fairly */
function scoreSet(qs){
  var sums={},cnt={},order=[];
  qs.forEach(function(q){if(!(q.g in sums)){sums[q.g]=0;cnt[q.g]=0;order.push(q.g);}sums[q.g]+=(state.a[q.id]||0);cnt[q.g]++;});
  var arr=order.map(function(g,i){return {g:g,raw:sums[g],max:cnt[g]*5,pct:Math.round(sums[g]/(cnt[g]*5)*100),i:i};});
  arr.sort(function(x,y){return (y.pct-x.pct)||(x.i-y.i);});
  return arr;
}

/* ============================ SCREENS ============================ */
function renderWelcome(){
  app.appendChild(el("p",{class:"kicker",text:"Rooted in Real Life · For Teens"}));
  app.appendChild(el("h2",{text:"Your Soul Portrait"}));
  app.appendChild(el("p",{class:"intro",text:"Four short assessments to help you discover your temperament, your predominant fault, your charism, and your saboteur. It takes about 12 minutes. Answer honestly and prayerfully. There are no wrong answers, only deeper invitations to grace."}));
  app.appendChild(el("p",{class:"scripture",text:"“You are fearfully and wonderfully made.” Psalm 139:14"}));

  var c=el("div",{class:"card"});
  c.appendChild(el("label",{class:"q","for":"nm",text:"What should we call you?"}));
  var nm=el("input",{type:"text",id:"nm",maxlength:"40",autocomplete:"given-name"});
  nm.value=state.name;nm.addEventListener("input",function(){state.name=nm.value;save();updateNav();});
  c.appendChild(nm);
  c.appendChild(el("label",{class:"q","for":"em",style:"margin-top:16px",text:"Your email address"}));
  c.appendChild(el("p",{class:"hint",text:"Required. Your coach will use this to reach you about your results."}));
  var em=el("input",{type:"email",id:"em",maxlength:"120",autocomplete:"email",inputmode:"email"});
  em.value=state.email;em.addEventListener("input",function(){state.email=em.value;save();updateNav();});
  c.appendChild(em);
  c.appendChild(el("label",{class:"q","for":"ag",style:"margin-top:16px",text:"How old are you?"}));
  var ag=el("select",{id:"ag"});
  ag.appendChild(el("option",{value:"",text:"Choose..."}));
  for(var i=13;i<=18;i++){ag.appendChild(el("option",{value:String(i),text:String(i)}));}
  ag.value=state.age;ag.addEventListener("change",function(){state.age=ag.value;save();updateNav();});
  c.appendChild(ag);
  var row=el("label",{style:"display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-family:var(--sans);font-size:14px;color:var(--ink-light);cursor:pointer"});
  var cb=el("input",{type:"checkbox",id:"cn",style:"width:22px;height:22px;margin-top:1px;flex:none"});
  cb.checked=state.consent;cb.addEventListener("change",function(){state.consent=cb.checked;save();updateNav();});
  row.appendChild(cb);
  row.appendChild(el("span",{text:"A parent or guardian knows I'm doing this, and I'm okay with my answers being sent to my coach, Cassandra."}));
  c.appendChild(row);
  app.appendChild(c);

  app.appendChild(el("p",{class:"hint",text:"When you finish, your results are sent to your coach so she can get to know you before you start. Only she sees them."}));
  app.appendChild(el("details",{class:"parents"},
    el("summary",{text:"For parents and guardians"}),
    el("p",{text:"This is a reflective, faith-centered tool. It is not therapy and it is not a diagnosis. While your teen answers, their responses are saved only in this browser. When they finish, their name, email, age, and results are emailed to their coach, Cassandra, and are not shared with anyone else. Your teen can also download their own copy. If your teen is struggling with safety or mental health, please contact a licensed professional, or call or text 988 (U.S.)."})
  ));
}

function renderAssessment(idx){
  var st=STEPS[idx];
  app.appendChild(el("p",{class:"kicker",text:"Assessment "+(idx+1)+" of "+STEPS.length}));
  app.appendChild(el("h2",{text:st.title}));
  app.appendChild(el("p",{class:"intro",text:st.sub}));
  app.appendChild(el("p",{class:"scripture",text:"“"+st.verse[0]+"” "+st.verse[1]}));
  app.appendChild(el("p",{class:"hint",text:"Tap how true each statement is for you: 1 = not like me, 5 = very much like me."}));
  app.appendChild(el("div",{class:"warn",id:"warn",role:"alert"}));
  st.qs.forEach(function(q,i){
    var card=el("div",{class:"card",id:"card_"+q.id});
    card.appendChild(el("p",{class:"num",text:"Statement "+(i+1)+" of "+st.qs.length}));
    card.appendChild(el("span",{class:"q",text:q.q}));
    var sc=el("div",{class:"scale",role:"group","aria-label":q.q});
    [1,2,3,4,5].forEach(function(n){
      sc.appendChild(el("button",{type:"button","aria-pressed":String(state.a[q.id]===n),"aria-label":n+" of 5",text:String(n),onclick:function(){
        state.a[q.id]=n;save();card.classList.remove("missing");
        Array.prototype.forEach.call(sc.children,function(x){x.setAttribute("aria-pressed",String(Number(x.textContent)===n));});
      }}));
    });
    card.appendChild(sc);
    card.appendChild(el("div",{class:"scale-ends"},el("span",{text:"Not like me"}),el("span",{text:"Very much like me"})));
    app.appendChild(card);
  });
  if(st.key==="s"){
    var nc=el("div",{class:"card"});
    nc.appendChild(el("label",{class:"q","for":"note",text:"Anything you'd like your coach to know? (optional)"}));
    var ta=el("textarea",{id:"note",maxlength:"1000"});
    ta.value=state.note;ta.addEventListener("input",function(){state.note=ta.value;save();});
    nc.appendChild(ta);
    app.appendChild(nc);
  }
}

function barRows(list,infoMap,topN){
  var box=el("div",{});
  list.forEach(function(r,i){
    var label=infoMap?infoMap[r.g].label:"";
    var row=el("div",{class:"barrow"});
    if(infoMap)row.appendChild(el("div",{class:"bl"},el("span",{text:label+(i<topN?" ★":"")})));
    var b=el("div",{class:"bar"});var f=el("div");f.style.width=r.pct+"%";b.appendChild(f);row.appendChild(b);
    box.appendChild(row);
  });
  return box;
}

function buildResults(){
  var rT=scoreSet(T),rF=scoreSet(F),rC=scoreSet(C),rS=scoreSet(S);
  return {rT:rT,rF:rF,rC:rC,rS:rS,
    top:{temp:TEMP[rT[0].g].label,temp2:TEMP[rT[1].g].label,fault:FAULT[rF[0].g].label,
      charisms:rC.slice(0,3).map(function(r){return CHARISM[r.g].label;}).join(", "),
      sabs:rS.slice(0,2).map(function(r){return SAB[r.g].label;}).join(", ")}};
}
function summaryLine(list,map){return list.map(function(r){return map[r.g].label+": "+r.raw+"/"+r.max+" ("+r.pct+"%)";}).join(" | ");}

function resultsText(R){
  var L=[];
  L.push("SOUL PORTRAIT RESULTS - "+clean(state.name)+" (age "+state.age+")");
  L.push("Email: "+clean(state.email));L.push("");
  L.push("Primary temperament: "+R.top.temp+" (secondary: "+R.top.temp2+")");
  L.push("Predominant fault: "+R.top.fault);
  L.push("Top charisms: "+R.top.charisms);
  L.push("Main saboteurs: "+R.top.sabs);L.push("");
  L.push("TEMPERAMENT - "+summaryLine(R.rT,TEMP));
  L.push("PREDOMINANT FAULT - "+summaryLine(R.rF,FAULT));
  L.push("CHARISM - "+summaryLine(R.rC,CHARISM));
  L.push("SABOTEURS - "+summaryLine(R.rS,SAB));
  if(clean(state.note)){L.push("");L.push("Note from teen: "+clean(state.note));}
  return L.join("\n");
}

function resBlock(title){return el("div",{class:"res"},el("h3",{text:title}));}

function renderResults(){
  var R=buildResults();
  var nm=clean(state.name);
  app.appendChild(el("div",{style:"text-align:center;margin-bottom:16px"},
    el("div",{style:"color:var(--wheat);font-size:26px","aria-hidden":"true",text:"✝"}),
    el("p",{class:"kicker",text:"Your Soul Portrait"}),
    el("h2",{text:"Thank you, "+nm}),
    el("p",{class:"intro",text:"This is a starting snapshot of how God made you, not a label. You are more than any result on this page."})
  ));

  var status=el("p",{class:"status",role:"status"});
  var retry=el("button",{type:"button",class:"btn solid",text:"Try sending again",style:"display:none;margin-bottom:14px",onclick:function(){send(R,status,retry);}});
  app.appendChild(status);app.appendChild(retry);

  if(SHOW_RESULT_NAMES){
    var t=TEMP[R.rT[0].g],t2=TEMP[R.rT[1].g];
    var b1=resBlock("I. YOUR TEMPERAMENT");
    b1.appendChild(el("div",{class:"hl",text:t.label}));
    b1.appendChild(el("p",{class:"tag-line",text:t.tag}));
    b1.appendChild(el("p",{html:t.desc}));
    b1.appendChild(el("span",{class:"lbl",text:"Saints with this temperament"}));
    b1.appendChild(el("p",{text:t.saints.join(", ")}));
    b1.appendChild(el("span",{class:"lbl",text:"Virtues to grow in"}));
    var tg=el("div",{class:"tags"});t.virtues.forEach(function(v){tg.appendChild(el("span",{text:v}));});b1.appendChild(tg);
    b1.appendChild(el("div",{class:"second"},el("span",{class:"lbl",text:"Your secondary temperament"}),el("p",{text:t2.label+": "+t2.tag+". Most people are a blend, and your secondary one shapes how your main temperament shows up."})));
    b1.appendChild(barRows(R.rT,TEMP,2));
    app.appendChild(b1);

    var f=FAULT[R.rF[0].g];
    var b2=resBlock("II. YOUR PREDOMINANT FAULT");
    b2.appendChild(el("div",{class:"hl",text:f.label}));
    b2.appendChild(el("p",{class:"tag-line",text:f.tag}));
    b2.appendChild(el("p",{text:"Everyone has one. It isn't a verdict on you. Naming it is exactly how the saints began to grow."}));
    b2.appendChild(el("span",{class:"lbl",text:"How to fight it"}));
    b2.appendChild(el("p",{text:f.remedy}));
    b2.appendChild(el("div",{class:"try"},el("b",{text:"Try this"}),document.createTextNode(f.practice)));
    b2.appendChild(barRows(R.rF,FAULT,1));
    app.appendChild(b2);

    var b3=resBlock("III. YOUR CHARISMS");
    R.rC.slice(0,2).forEach(function(r,i){
      var c=CHARISM[r.g];
      b3.appendChild(el("div",{class:"hl",text:c.label}));
      b3.appendChild(el("p",{class:"tag-line",text:c.tag}));
      b3.appendChild(el("p",{text:c.desc}));
    });
    b3.appendChild(barRows(R.rC,CHARISM,2));
    app.appendChild(b3);

    var s=SAB[R.rS[0].g];
    var b4=resBlock("IV. YOUR SABOTEUR");
    b4.appendChild(el("div",{class:"hl",text:s.label}));
    b4.appendChild(el("p",{class:"tag-line",text:s.tag}));
    b4.appendChild(el("p",{text:s.desc}));
    b4.appendChild(el("div",{class:"try"},el("b",{text:"Try this"}),document.createTextNode(s.practice)));
    var s2=SAB[R.rS[1].g];
    b4.appendChild(el("div",{class:"second"},el("span",{class:"lbl",text:"Also showing up for you"}),el("p",{text:s2.label+": "+s2.tag+"."})));
    b4.appendChild(barRows(R.rS,SAB,2));
    app.appendChild(b4);

    app.appendChild(el("div",{class:"closing",html:"Your coach will go through these results with you and help you understand what they mean for your life.<small>“Before I formed you in the womb I knew you.” Jeremiah 1:5</small>"}));
  }else{
    [["I. TEMPERAMENT",R.rT],["II. PREDOMINANT FAULT",R.rF],["III. CHARISMS",R.rC],["IV. SABOTEURS",R.rS]].forEach(function(p){
      var b=resBlock(p[0]);b.appendChild(barRows(p[1],null,0));app.appendChild(b);
    });
    app.appendChild(el("div",{class:"closing",html:"Your Soul Portrait is being prepared personally for you. Cassandra will reach out to arrange delivery.<small>“Before I formed you in the womb I knew you.” Jeremiah 1:5</small>"}));
  }

  app.appendChild(el("div",{class:"care"},
    el("b",{text:"If things ever feel heavy. "}),
    document.createTextNode("These results are for reflection. They are not a diagnosis or a mental health test. If you are struggling, please talk to a trusted adult such as a parent, mentor, counselor, or priest. In the U.S. you can call or text 988 anytime for the Suicide & Crisis Lifeline. If you are in immediate danger, call 911.")));

  var toast=el("p",{class:"status",role:"status"});
  app.appendChild(el("div",{class:"actions"},
    el("button",{type:"button",class:"btn solid",text:"Download my results",onclick:function(){
      try{var blob=new Blob([resultsText(R)],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);
        a.download="soul-portrait-"+(nm.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"teen")+".txt";document.body.appendChild(a);a.click();document.body.removeChild(a);}
      catch(e){toast.textContent="Download didn't work here.";}
    }}),
    el("button",{type:"button",class:"btn line",text:"Print",onclick:function(){window.print();}})
  ));
  app.appendChild(toast);
  app.appendChild(el("button",{type:"button",class:"btn line",text:"Clear my answers and start over",onclick:function(){
    if(window.confirm("This erases everything you entered on this device. Continue?")){wipe();state={step:0,name:"",email:"",age:"",consent:false,sent:false,note:"",a:{}};render();window.scrollTo(0,0);}
  }}));

  send(R,status,retry);
}

function send(R,status,retry){
  if(state.sent){status.style.color="var(--green)";status.textContent="Sent! Your coach has your results and will be in touch at "+clean(state.email)+".";retry.style.display="none";return;}
  if(!FORM_ENDPOINT){status.style.color="var(--rose)";status.textContent="This page isn't connected to email yet, so your results haven't been sent. Please download them below and send them to your coach.";return;}
  status.style.color="var(--ink-light)";status.textContent="Sending your results to your coach...";retry.style.display="none";
  var payload={
    _subject:"New Teen Soul Portrait: "+clean(state.name),
    email:clean(state.email),
    "Client Name":clean(state.name),"Client Email":clean(state.email),"Age":state.age,
    "Date Completed":new Date().toLocaleDateString(),
    "Parent/guardian aware":"Yes (checked by teen)",
    "Primary Temperament":R.top.temp,"Secondary Temperament":R.top.temp2,
    "Predominant Fault":R.top.fault,"Top Charisms":R.top.charisms,"Primary Saboteurs":R.top.sabs,
    "Temperament Scores":summaryLine(R.rT,TEMP),"Fault Scores":summaryLine(R.rF,FAULT),
    "Charism Scores":summaryLine(R.rC,CHARISM),"Saboteur Scores":summaryLine(R.rS,SAB),
    "Note from teen":clean(state.note)||"(none)",
    _gotcha:""
  };
  fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)})
    .then(function(r){if(!r.ok)throw new Error("bad status");state.sent=true;save();status.style.color="var(--green)";status.textContent="Sent! Your coach has your results and will be in touch at "+clean(state.email)+".";})
    .catch(function(){status.style.color="var(--rose)";status.textContent="We couldn't send your results just now. Check your connection and try again, or contact "+COACH_CONTACT+". You can still download your results below.";retry.style.display="inline-block";});
}

/* ============================ NAV / RENDER ======================= */
function tryNext(idx){
  var missing=unanswered(STEPS[idx].qs);
  if(missing.length){
    var w=document.getElementById("warn");
    w.textContent="Please answer every statement. "+missing.length+" left.";w.style.display="block";
    missing.forEach(function(q){var c=document.getElementById("card_"+q.id);if(c)c.classList.add("missing");});
    var first=document.getElementById("card_"+missing[0].id);
    if(first&&first.scrollIntoView)first.scrollIntoView({block:"center"});
    return;
  }
  go(state.step+1);
}
function updateNav(){
  nav.textContent="";
  var s=state.step;
  if(s===0){
    var b=el("button",{type:"button",class:"btn primary",text:"Begin",onclick:function(){go(1);}});
    if(!formValid())b.setAttribute("disabled","disabled");
    nav.appendChild(b);
  }else if(s<=STEPS.length){
    nav.appendChild(el("button",{type:"button",class:"btn ghost",text:"Back",onclick:function(){go(s-1);}}));
    nav.appendChild(el("button",{type:"button",class:"btn primary",text:s===STEPS.length?"See my results":"Next",onclick:function(){tryNext(s-1);}}));
  }else{
    nav.appendChild(el("button",{type:"button",class:"btn ghost",text:"Back to my answers",onclick:function(){go(STEPS.length);}}));
  }
}
function render(){
  app.textContent="";
  var s=state.step;
  if(s>STEPS.length){
    /* never show results unless every statement is answered and the form is valid */
    var all=T.concat(F,C,S);
    if(!formValid()||unanswered(all).length){state.step=0;s=0;}
  }
  if(s===0)renderWelcome();
  else if(s<=STEPS.length)renderAssessment(s-1);
  else renderResults();
  bar.style.width=Math.round(s/LAST*100)+"%";
  updateNav();
}

load();
render();
})();
</script>
